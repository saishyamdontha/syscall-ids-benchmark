scenario_zip: data/raw/lidds/CVE-2014-0160.zip
seed: 42
per_thread: true          # each syscall judged in the context of its own thread
fpr_targets: [0.01, 0.05]
# Declared BEFORE looking at any per-thread result (same grid/rule as before):
windows: [10, 20, 50, 100, 200]
selection_metric: "0.01"
tiebreak_metric: "0.05"
models:
  - {type: ngram, n: 3}
  - {type: ngram, n: 6}
  - {type: ngram_lm, n: 3, k: 0.1}
  - {type: ngram_lm, n: 4, k: 0.1}
  - {type: lstm, emb: 64, hidden: 128, layers: 2, dropout: 0.2, chunk: 64, stride: 32,
     max_epochs: 100, patience: 6, trace_agg: mean, seed: 42}
