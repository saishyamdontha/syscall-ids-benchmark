data_root: data/raw/ADFA-LD
seed: 42
dev_folders_per_family: 3
fpr_targets: [0.01, 0.05]
# Declared BEFORE looking at any streaming result:
windows: [10, 20, 50, 100, 200]      # running-score window W, in items (~syscalls)
selection_metric: "0.01"             # per model: best dev detection @1% of normals alarming
tiebreak_metric: "0.05"              # then @5%, then the smaller dev median delay
models:
  - {type: ngram, n: 3}
  - {type: ngram, n: 6}
  - {type: lstm, emb: 64, hidden: 128, layers: 2, dropout: 0.2, chunk: 64, stride: 32,
     max_epochs: 100, patience: 6, trace_agg: mean, seed: 42}
throughput_syscalls: 3000
