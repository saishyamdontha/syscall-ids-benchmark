data_root: data/raw/ADFA-LD
seed: 42
dev_folders_per_family: 3
fpr_targets: [0.01, 0.05]
# Declared BEFORE looking at any v2 result:
selection_metric: "0.01"        # pick the candidate with best dev detection @1% FPR
tiebreak_metric: "0.05"         # then @5% FPR
models:
  - {type: ngram, n: 3}
  - {type: ngram, n: 6}
  - {type: lstm, emb: 64, hidden: 128, layers: 2, dropout: 0.2, chunk: 64, stride: 32,
     max_epochs: 100, patience: 6, trace_agg: mean, seed: 42}
fusion_rules: [fisher, min_p]
